idea:
  title: Logit Lens with Implicit Tokens
  domain: artificial_intelligence
  hypothesis: 'Large language models have implicit vocabularies that are not strictly
    part of the vocabulary matrices but function similarly; it is possible to create
    a logit lens that utilizes these implicit tokens.

    '
  background:
    description: 'There are now many signs that LLMs have implicit vocab, that aren''t
      strictly part of the vocabulary matrices, but almost act like it. (See: https://arxiv.org/abs/2406.20086)
      Can we make a logit lens that uses these?

      '
    papers:
    - description: https://arxiv.org/abs/2406.20086
  metadata:
    author: Ari Holtzman
    source: IdeaHub
    source_url: https://hypogenic.ai/ideahub/idea/tO8okrersuj6MqmTj1VG
